name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test suite
        run: python -m pytest
      - name: Import check
        run: python -c "from engine import HFTEngine; print('engine imports ok')"
      - name: Offline engine smoke test (stubbed feed)
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta
          from engine import HFTEngine
          from engine.models import MarketData
          bars = [MarketData("TEST", datetime(2024,1,1)+timedelta(days=i), c, c*1.01, c*0.99, c, 1000.0)
                  for i, c in enumerate([90, 95, 110, 120, 80])]
          from engine.market_data import MarketDataHandler
          MarketDataHandler.connect = lambda self: bars
          om = HFTEngine("TEST", "2024-01-01", "2024-02-01", strategy="threshold", threshold=100.0).run()
          assert len(om.trades) >= 1, "expected at least one trade"
          assert all(t.symbol == "TEST" for t in om.trades), "symbol must be preserved on finalize"
          print(f"offline smoke ok: {len(om.trades)} trades, {len(om.equity_curve)} bars")
          EOF
