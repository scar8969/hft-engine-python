name: Bug report
description: Report a bug in HFT-Engine
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the console output or error traceback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.11"
    validations:
      required: true
